<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Channel Member Exporter</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 30px 25px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #333; margin-bottom: 10px; font-size: 22px; }
        p { color: #666; margin-bottom: 20px; font-size: 14px; }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 15px;
        }
        input:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:disabled { opacity: 0.6; }
        .error {
            background: #ffe0e0;
            color: #c00;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
            word-wrap: break-word;
        }
        .info {
            background: #e8f0fe;
            color: #1a73e8;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 13px;
            line-height: 1.5;
        }
        .loader {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #667eea;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📥 Telegram Channel Exporter</h1>
        <p>Public channel ka username daalein aur CSV download karein</p>
        <form method="POST" onsubmit="showLoader()">
            <input type="text" name="channel" placeholder="ClassyCallTips" required autofocus>
            <button type="submit" id="btn">Export Members CSV</button>
        </form>
        <div class="loader" id="loader">⏳ Members nikaale ja rahe hain...</div>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <div class="info">
            ℹ️ Sirf public channels. Telegram ki limit ke wajah se max ~200 members hi milenge.
        </div>
    </div>
    <script>
        function showLoader() {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('btn').disabled = true;
            document.getElementById('btn').innerText = 'Processing...';
        }
    </script>
</body>
</html>
